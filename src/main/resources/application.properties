# ===============================================================
# Common Properties (Shared by all profiles)
# ===============================================================
spring.application.name=battlegrounds

# Default profile is 'local'. 
# Overridden by SPRING_PROFILES_ACTIVE environment variable in Docker/Prod.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Server Configuration
server.port=8080

spring.web.resources.add-mappings=false

# ===============================================================
# Add other common settings here (e.g., JSON formatting, 
# File upload limits, etc.)
# ===============================================================

# JWT settings (default values - change secret in production)
jwt.secret=${JWT_SECRET:replace-this-secret-with-at-least-32-chars}
jwt.access-token-validity-ms=900000
jwt.refresh-token-validity-ms=604800000

spring.config.import=optional:configtree:/run/secrets/

# OpenAPI / Swagger
springdoc.api-docs.path=/v1/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.show-actuator=false
