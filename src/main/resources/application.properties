spring.application.name=battlegrounds

# Default profile is 'local'. 
# Overridden by SPRING_PROFILES_ACTIVE environment variable in Docker/Prod.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Server Configuration
server.port=8080

