services:
  app:
    image: spring-boot-prod:latest
    build:
      # Build context is the project root
      context: ..
      dockerfile: docker/prod/Dockerfile
    container_name: spring-boot-app-prod
    ports:
      - "8080:8080"
    environment:
      # Typical overrides for a production-like run; adjust as needed
      SPRING_PROFILES_ACTIVE: "prod"
      # Disable devtools if the dependency is present on the classpath
      SPRING_DEVTOOLS_RESTART_ENABLED: "false"
      DB_HOST: "postgres"
      DB_PORT: "5432"
    secrets:
      - DB_NAME
      - DB_USER
      - DB_PASSWORD
      - JWT_SECRET

# No local postgres service in this compose file for production; the application connects to a separate Postgres machine
secrets:
  DB_NAME:
    file: ../secrets/db_name
  DB_USER:
    file: ../secrets/db_user
  DB_PASSWORD:
    file: ../secrets/db_password
  JWT_SECRET:
    file: ../secrets/jwt_secret

volumes:
  postgres-data-prod:

